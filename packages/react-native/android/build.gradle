apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def googlePlayServicesAdsVersion = safeExtGet('googlePlayServicesAdsVersion', '25.4.0')

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.1')
    }
}

android {
    namespace 'admob.plus.rn'
    compileSdk safeExtGet('compileSdkVersion', 35)
    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 23)
        targetSdk safeExtGet('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }
   compileOptions {
       sourceCompatibility JavaVersion.VERSION_17
       targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'  // From node_modules
    implementation "com.google.android.gms:play-services-ads:$googlePlayServicesAdsVersion"
}
